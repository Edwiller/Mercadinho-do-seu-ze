<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - Mercadinho Seu Zé</title>

    <link rel="stylesheet" href="css/styles.css">

    <script
        src="js/cadastrar.js"
        defer>
    </script>
</head>

<body>

    <main class="container-auth">

        <h1>Cadastro de usuário</h1>

        <p class="subtitulo">
            Preencha os dados abaixo para cadastrar um novo usuário.
        </p>

        <form id="form-cadastro">

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome completo"
                autocomplete="name"
                minlength="3"
                maxlength="100"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite o endereço de e-mail"
                autocomplete="email"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite uma senha"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit">
                Cadastrar usuário
            </button>

        </form>

        <p
            id="mensagem"
            class="mensagem"
            role="alert">
        </p>

        <a href="login.html">
            Já possuo cadastro
        </a>

    </main>

</body>

</html>
