<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar usuário - Mercadinho Seu Zé</title>

    <link rel="stylesheet" href="css/styles.css">

    <script
        src="js/editar-usuario.js"
        defer>
    </script>
</head>

<body>

    <main class="container-auth">

        <h1>Editar usuário</h1>

        <p class="subtitulo">
            Atualize os dados do usuário selecionado.
        </p>

        <form id="form-editar">

            <input
                type="hidden"
                id="id"
            >

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                required
                minlength="3"
                maxlength="100"
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                required
            >

            <button type="submit">
                Salvar alterações
            </button>

        </form>

        <p
            id="mensagem"
            class="mensagem"
            role="alert">
        </p>

        <a href="home.html">
            Voltar para o painel
        </a>

    </main>

</body>

</html>
