<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Mercadinho Seu Zé</title>

    <link rel="stylesheet" href="css/styles.css">

    <script
        src="js/login.js"
        defer>
    </script>
</head>

<body>

    <main class="container-auth">

        <h1>Acesso ao sistema</h1>

        <p class="subtitulo">
            Informe suas credenciais para acessar o Mercadinho Seu Zé.
        </p>

        <form id="form-login">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p
            id="mensagem"
            class="mensagem"
            role="alert">
        </p>

        <a href="cadastrar.html">
            Cadastrar novo usuário
        </a>

    </main>

</body>

</html>
